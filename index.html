<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Banco — Asistente de diagnóstico</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="mesh"></div>
<div class="grain"></div>

<!-- ===================== PANTALLA DE PERFILES ===================== -->
<div id="profileScreen">
  <div class="profile-panel glass">
    <h1 id="profileScreenTitle">¿Quién repara hoy?</h1>
    <div class="profile-grid" id="profileGrid"></div>

    <!-- Sección: Prueba gratis sin API Key -->
    <div class="demo-section">
      <p class="demo-section-title">No tienes API Key?</p>
      <button type="button" class="demo-btn" id="demoTryBtn">
        <svg class="icon" viewBox="0 0 24 24" style="width:20px;height:20px;"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg>
        Probar ahora
      </button>
      <p class="demo-sub">Entra al chat con Groq (Llama 3.3 70B) gratis, sin registrarte</p>
    </div>

    <div class="profile-screen-actions">
      <button type="button" class="manage-btn" id="manageToggle">
        <svg class="icon" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        Administrar perfiles
      </button>
    </div>
  </div>
</div>

<!-- ===================== VISTA DE CHAT ===================== -->
<header>
  <div class="headerbar glass">
    <button type="button" class="header-avatar-btn" id="switchProfileBtn" title="Cambiar de perfil"></button>
    <div class="headertext">
      <h1 id="activeProfileLabel">sin perfil</h1>
      <div class="sub">toca el avatar para cambiar</div>
    </div>
    <button type="button" id="historyBtn" class="iconbtn" title="Historial">
      <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
    </button>
  </div>
</header>

<!-- Modal: historial -->
<div id="historyModal" class="modal-overlay" style="display:none;">
  <div class="modal glass">
    <h2>
      <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
      Historial
    </h2>
    <div id="historyContent"></div>
    <button type="button" class="danger-btn" id="clearHistoryBtn">
      <svg class="icon" viewBox="0 0 24 24" style="width:15px;height:15px;display:inline;vertical-align:-2px;margin-right:4px;"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
      Borrar todo el historial
    </button>
    <button type="button" class="ghost-btn" id="closeHistoryBtn">Cerrar</button>
  </div>
</div>

<!-- Modal: crear/editar perfil -->
<div id="editModal" class="modal-overlay" style="display:none;">
  <div class="modal glass">
    <h2 id="editTitle">Nuevo perfil</h2>

    <div class="avatar-picker">
      <div class="avatar-preview" id="avatarPreview">?</div>
      <div class="avatar-actions">
        <button type="button" id="uploadAvatarBtn">
          <svg class="icon" viewBox="0 0 24 24" style="width:14px;height:14px;"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2Z"/><circle cx="12" cy="13" r="4"/></svg>
          Subir foto
        </button>
        <button type="button" id="removeAvatarBtn">
          <svg class="icon" viewBox="0 0 24 24" style="width:14px;height:14px;"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
          Quitar foto
        </button>
      </div>
      <input type="file" id="avatarFileInput" accept="image/*" style="display:none;">
    </div>

    <div class="color-row" id="colorRow"></div>

    <div class="field">
      <label class="field-label">Nombre del perfil</label>
      <input type="text" id="profileNameInput" placeholder="Ej: Taller, PS4, Laptops...">
    </div>

    <div class="field">
      <label class="field-label">Proveedor de API</label>
      <select id="providerSelect">
        <option value="groq">Groq (gratis, sin tarjeta)</option>
        <option value="anthropic">Anthropic / Claude</option>
        <option value="openai">OpenAI</option>
        <option value="custom">Otro compatible con OpenAI (URL personalizada)</option>
      </select>
    </div>

    <div class="field" id="customUrlField" style="display:none;">
      <label class="field-label">URL del endpoint</label>
      <input type="text" id="customUrlInput" placeholder="https://.../v1/chat/completions">
    </div>

    <div class="field">
      <label class="field-label">Clave de API</label>
      <input type="password" id="profileKeyInput" placeholder="Pega tu clave aquí" autocomplete="off">
    </div>

    <p class="modal-text" id="providerHint"></p>

    <button type="button" class="primary-btn" id="saveProfileBtn">
      <svg class="icon" viewBox="0 0 24 24" style="width:15px;height:15px;"><path d="M20 6 9 17l-5-5"/></svg>
      Guardar perfil
    </button>
    <button type="button" class="danger-btn" id="deleteProfileBtn" style="display:none;">Eliminar este perfil</button>
    <button type="button" class="ghost-btn" id="cancelEditBtn">Cancelar</button>
  </div>
</div>

<main id="thread">
  <div class="empty glass" id="emptyState"></div>
</main>

<footer>
  <form id="chatForm" class="glass">
    <textarea id="input" rows="1" placeholder="Describe el equipo y la falla..."></textarea>
    <button type="submit" class="send" id="sendBtn">
      <svg class="icon" viewBox="0 0 24 24" style="stroke:#fff;"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
    </button>
  </form>
  <div class="hint">Diagnóstico orientativo. Verifica siempre con multímetro antes de desoldar.</div>
</footer>

<script src="script.js"></script>
</body>
</html>
